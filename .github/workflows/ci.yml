# CI/CD pipeline for MealLoop.
# - On pull requests: test, coverage and integration run (deploy is skipped).
# - On push to main: the same jobs run, then deploy runs only if all of them pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # Job 1: lint + unit tests
  # The job name "test" is a required check in branch protection.
  # ---------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8

      - name: Run tests
        run: pytest

  # ---------------------------------------------------------------
  # Job 2: tests with coverage, report saved as a downloadable artifact
  # ---------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs all tests and writes terminal, HTML and XML coverage reports
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=html --cov-report=xml

      # Saves the report so it can be downloaded from the run page
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

  # ---------------------------------------------------------------
  # Job 3: build the image, start the container, check /health
  # ---------------------------------------------------------------
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mealloop:ci .

      - name: Start container
        run: docker run -d --name mealloop-ci -p 5000:5000 mealloop:ci

      # Wait up to ~60s for Docker's own HEALTHCHECK to report "healthy"
      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' mealloop-ci)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "Container never became healthy"
          docker logs mealloop-ci
          exit 1

      # Fail the job unless /health returns HTTP 200
      - name: Curl /health
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          echo "HTTP status: $CODE"
          [ "$CODE" = "200" ]

      # Show logs if anything above failed
      - name: Show logs on failure
        if: failure()
        run: docker logs mealloop-ci

      # always() stops the container even if an earlier step failed
      - name: Stop container
        if: always()
        run: docker rm -f mealloop-ci

  # ---------------------------------------------------------------
  # Job 4: deploy (only on push to main, only after everything passes)
  # ---------------------------------------------------------------
  deploy:
    name: deploy
    needs: [test, coverage, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # lets GITHUB_TOKEN push to ghcr.io
    environment:
      name: production
      # Replace with your real Render URL (shows a "View deployment" link)
      url: https://mealloop.onrender.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ghcr.io requires a lowercase image name
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set yet, skipping deploy trigger."
          else
            curl --fail -s -X POST "$HOOK"
            echo "Deploy triggered."
          fi