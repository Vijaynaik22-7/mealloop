
{% extends "base.html" %}

{% block title %}Create Donation - MealLoop{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-success">Create Food Donation</h2>

    <p class="text-muted">
        Share your surplus food and help someone in need.
    </p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Food Name</label>
            <input type="text"
                   name="food_name"
                   class="form-control"
                   placeholder="Example: Vegetable Rice"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number"
                   name="quantity"
                   class="form-control"
                   min="1"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Unit</label>
            <select name="unit" class="form-select" required>
                <option value="">Select unit</option>
                <option value="plates">Plates</option>
                <option value="kg">Kilograms</option>
                <option value="packets">Packets</option>
                <option value="litres">Litres</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Prepared At</label>
            <input type="datetime-local"
                   name="prepared_at"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Expiry Time</label>
            <input type="datetime-local"
                   name="expiry_time"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Pickup Location</label>
            <textarea name="pickup_location"
                      class="form-control"
                      rows="3"
                      placeholder="Enter pickup address"
                      required></textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Submit Donation
        </button>

        <a href="{{ url_for('provider.dashboard') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
