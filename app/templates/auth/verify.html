{% extends "base.html" %}
{% block title %}Verify your email{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-2">Verify your email</h2>
        <p class="text-muted">
          Enter the 6-digit code we sent to
          <strong>{{ masked_email }}</strong>.
          The code works for 10 minutes.
        </p>

        <!-- Form 1: check the code -->
        <form method="post" action="{{ url_for('auth.verify') }}">
          <div class="mb-3">
            <label class="form-label" for="code">Verification code</label>
            <input class="form-control form-control-lg text-center"
                   id="code" name="code" type="text"
                   inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                   autocomplete="one-time-code" placeholder="123456"
                   style="letter-spacing: 0.4em;" required autofocus>
          </div>
          <button class="btn btn-success w-100" type="submit">Verify</button>
        </form>

        <hr class="my-4">

        <!-- Form 2: ask for a new code (the server also enforces 60 s) -->
        <form method="post" action="{{ url_for('auth.resend') }}">
          <button class="btn btn-outline-secondary w-100" type="submit"
                  id="resendBtn"
                  {% if wait_seconds > 0 %}disabled{% endif %}>
            <span id="resendLabel">Resend code</span>
          </button>
        </form>

        <p class="mt-3 mb-0 text-center">
          <a href="{{ url_for('auth.login') }}">Back to login</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  // Count down until the "Resend code" button can be used again
  let secondsLeft = {{ wait_seconds|int }};
  const resendBtn = document.getElementById("resendBtn");
  const resendLabel = document.getElementById("resendLabel");

  function tick() {
    if (secondsLeft > 0) {
      resendLabel.textContent = "Resend code (" + secondsLeft + "s)";
      secondsLeft -= 1;
      setTimeout(tick, 1000);
    } else {
      resendBtn.disabled = false;
      resendLabel.textContent = "Resend code";
    }
  }
  tick();
</script>
{% endblock %}
