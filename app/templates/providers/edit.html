
{% extends "base.html" %}

{% block title %}Edit Donation - MealLoop{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h2 class="text-success mb-4">
                    Edit Food Donation
                </h2>

                <form method="POST"
                      action="{{ url_for('provider.edit_donation',
                                         donation_id=donation.id) }}">

                    <div class="mb-3">
                        <label class="form-label">Food Name</label>
                        <input type="text"
                               name="food_name"
                               class="form-control"
                               value="{{ donation.food_name }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number"
                               name="quantity"
                               class="form-control"
                               min="1"
                               step="1"
                               value="{{ donation.quantity }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Unit</label>
                        <select name="unit"
                                class="form-select"
                                required>

                            <option value="plates"
                                {% if donation.unit == 'plates' %}selected{% endif %}>
                                Plates
                            </option>

                            <option value="kg"
                                {% if donation.unit == 'kg' %}selected{% endif %}>
                                Kilograms
                            </option>

                            <option value="packets"
                                {% if donation.unit == 'packets' %}selected{% endif %}>
                                Packets
                            </option>

                            <option value="litres"
                                {% if donation.unit == 'litres' %}selected{% endif %}>
                                Litres
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Prepared Date and Time</label>
                        <input type="datetime-local"
                               name="prepared_at"
                               class="form-control"
                               value="{{ donation.prepared_at.strftime('%Y-%m-%dT%H:%M') }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Expiry Date and Time</label>
                        <input type="datetime-local"
                               name="expiry_time"
                               class="form-control"
                               value="{{ donation.expiry_time.strftime('%Y-%m-%dT%H:%M') }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Pickup Location</label>
                        <textarea name="pickup_location"
                                  class="form-control"
                                  rows="3"
                                  required>{{ donation.pickup_location }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-success">
                        Save Changes
                    </button>

                    <a href="{{ url_for('provider.dashboard') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
