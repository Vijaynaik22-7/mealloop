services:
  app:
    build: .
    image: mealloop:latest
    container_name: mealloop
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=change-me-in-production
    volumes:
      # Named volume keeps the SQLite database when the container is recreated
      - mealloop_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mealloop_data: